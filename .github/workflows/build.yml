name: Build Lime's Visuals

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a .levipack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Configure CMake
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build + Package
        run: cmake --build build-arm64 --target package_levipack -j$(nproc)

      - name: Upload .levipack
        uses: actions/upload-artifact@v4
        with:
          name: limes-visuals-levipack
          path: build-arm64/limes-visuals.levipack
          if-no-files-found: error

      - name: Upload unpacked mod (debug)
        uses: actions/upload-artifact@v4
        with:
          name: limes-visuals-unpacked
          path: build-arm64/package/limes-visuals/
          if-no-files-found: error
